<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="FitBuddy helps you generate a personalized 7-day fitness plan based on your goals, age, weight, and experience level.">
<title>FitBuddy - AI Fitness Plan Generator</title>
<style>
:root {
  --bg-1: #f4f1ff;
  --bg-2: #dff7ff;
  --bg-3: #e9ffe8;
  --primary: #5b4ef5;
  --secondary: #ff6b6b;
  --accent: #22c55e;
  --accent-dark: #15803d;
  --text: #1f2937;
  --muted: #6b7280;
  --card: rgba(255, 255, 255, 0.92);
  --shadow: rgba(91, 78, 245, 0.18);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
  min-height: 100vh;
  padding: 30px 20px;
  color: var(--text);
}

.container {
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: clamp(2.2rem, 5vw, 3.3rem);
  color: var(--primary);
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 28px;
  font-size: 1.05rem;
  letter-spacing: 0.04em;
}

.card {
  background: var(--card);
  padding: 30px;
  border-radius: 24px;
  box-shadow: 0 18px 40px var(--shadow);
  border: 1px solid rgba(91, 78, 245, 0.08);
  backdrop-filter: blur(5px);
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
  font-weight: 700;
  color: var(--text);
}

input, select {
  width: 100%;
  padding: 13px 14px;
  border: 1.5px solid rgba(91, 78, 245, 0.15);
  border-radius: 12px;
  font-size: 16px;
  background: #fff;
  color: var(--text);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(91, 78, 245, 0.12);
}

button {
  width: 100%;
  margin-top: 28px;
  padding: 16px 20px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #7c6bff);
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 12px 24px rgba(91, 78, 245, 0.28);
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 28px rgba(91, 78, 245, 0.32);
  filter: brightness(1.03);
}

#result {
  margin-top: 28px;
}

.day {
  background: linear-gradient(135deg, #ffffff, #f7f7ff);
  margin-top: 16px;
  padding: 20px 22px;
  border-radius: 16px;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
  border-left: 6px solid var(--secondary);
}

.day h3 {
  color: var(--primary);
  margin-bottom: 8px;
  font-size: 1.15rem;
}

.user-info {
  background: linear-gradient(135deg, #eefdf5, #eff6ff);
  padding: 18px 20px;
  border-radius: 16px;
  margin-bottom: 18px;
  border: 1px solid rgba(34, 197, 94, 0.1);
}

.user-info h2,
#result h2 {
  color: var(--accent-dark);
  margin-bottom: 10px;
}

.user-info p {
  margin: 6px 0;
  color: var(--text);
}

@media (max-width: 600px) {
  body {
    padding: 20px 14px;
  }

  .card {
    padding: 22px 18px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>💪 FitBuddy</h1>
  <p class="subtitle">AI Fitness Plan Generator</p>

  <div class="card">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Enter your age">

    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter your weight">

    <label for="goal">Fitness Goal</label>
    <select id="goal">
      <option value="Weight Loss">Weight Loss</option>
      <option value="Muscle Gain">Muscle Gain</option>
      <option value="General Fitness">General Fitness</option>
      <option value="Flexibility">Flexibility</option>
    </select>

    <label for="intensity">Workout Intensity</label>
    <select id="intensity">
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>

    <label for="experience">Experience Level</label>
    <select id="experience">
      <option value="Beginner">Beginner</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Advanced">Advanced</option>
    </select>

    <button onclick="generatePlan()">Generate 7-Day Plan</button>
  </div>

  <div id="result" aria-live="polite"></div>
</div>

<script>
function generatePlan() {
  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let weight = document.getElementById("weight").value;
  let goal = document.getElementById("goal").value;
  let intensity = document.getElementById("intensity").value;
  let experience = document.getElementById("experience").value;

  if (name === "" || age === "" || weight === "") {
    alert("Please fill all the details.");
    return;
  }

  let workouts = [
    ["Day 1", "Full Body Workout", "Squats, wall push-ups, lunges and plank."],
    ["Day 2", "Cardio", "Walking, light jogging and stretching."],
    ["Day 3", "Upper Body", "Wall push-ups, arm raises and shoulder exercises."],
    ["Day 4", "Active Recovery", "Light walking and gentle stretching."],
    ["Day 5", "Lower Body", "Squats, lunges and glute bridges."],
    ["Day 6", "Core Workout", "Plank, bird-dog and gentle core exercises."],
    ["Day 7", "Rest Day", "Rest and gentle stretching."]
  ];

  let output = `
    <div class="user-info">
      <h2>Hello ${name}! 👋</h2>
      <p><b>Age:</b> ${age}</p>
      <p><b>Weight:</b> ${weight} kg</p>
      <p><b>Goal:</b> ${goal}</p>
      <p><b>Intensity:</b> ${intensity}</p>
      <p><b>Experience:</b> ${experience}</p>
    </div>

    <h2>📅 Your 7-Day Fitness Plan</h2>
  `;

  workouts.forEach(function(workout) {
    output += `
      <div class="day">
        <h3>${workout[0]} - ${workout[1]}</h3>
        <p>${workout[2]}</p>
      </div>
    `;
  });

  document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
